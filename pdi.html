<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Meu PDI — Plano de Desenvolvimento Individual</title>
<link href="https://fonts.googleapis.com/css2?family=Playfair+Display:ital,wght@0,400;0,600;0,700;1,400&family=DM+Sans:wght@300;400;500;600&display=swap" rel="stylesheet">
<style>
  :root {
    --bg: #f9f7f4;
    --surface: #ffffff;
    --surface2: #f3f1ee;
    --border: #e2ddd8;
    --accent: #8a6c3e;
    --accent-light: #c9a96e;
    --accent2: #5a4a7c;
    --text: #1e1a14;
    --text-muted: #7a736a;
    --green: #2d7a5a;
    --green-bg: #edf7f2;
    --red: #c0392b;
    --red-bg: #fef0ee;
    --radius: 12px;
    --shadow: 0 2px 16px rgba(0,0,0,0.06);
  }

  * { margin: 0; padding: 0; box-sizing: border-box; }

  body {
    background: var(--bg);
    color: var(--text);
    font-family: 'DM Sans', sans-serif;
    min-height: 100vh;
  }

  /* ── Header ── */
  header {
    background: var(--surface);
    border-bottom: 2px solid var(--border);
    padding: 0 40px;
  }

  .header-inner {
    max-width: 860px;
    margin: 0 auto;
    padding: 22px 0;
    display: flex; align-items: center; gap: 14px;
  }

  .logo-badge {
    width: 44px; height: 44px;
    background: linear-gradient(135deg, var(--accent), var(--accent2));
    border-radius: 10px;
    display: flex; align-items: center; justify-content: center;
    font-family: 'Playfair Display', serif;
    font-weight: 700; font-size: 20px; color: #fff;
    flex-shrink: 0;
  }

  .header-text h1 {
    font-family: 'Playfair Display', serif;
    font-size: 19px; font-weight: 700;
    color: var(--text);
  }

  .header-text span {
    font-size: 12px; color: var(--text-muted);
  }

  .codigo-pill {
    margin-left: auto;
    background: var(--surface2);
    border: 1px solid var(--border);
    padding: 6px 16px;
    border-radius: 20px;
    font-family: 'Courier New', monospace;
    font-size: 13px; font-weight: 700;
    color: var(--accent);
    letter-spacing: 1px;
  }

  /* ── Container ── */
  .container {
    max-width: 860px;
    margin: 0 auto;
    padding: 40px 24px 80px;
  }

  /* ── Perfil do mentorando ── */
  .perfil-card {
    background: var(--surface);
    border: 1px solid var(--border);
    border-radius: var(--radius);
    padding: 24px 28px;
    margin-bottom: 32px;
    display: flex; align-items: center; gap: 20px;
    box-shadow: var(--shadow);
  }

  .avatar {
    width: 56px; height: 56px;
    background: linear-gradient(135deg, var(--accent-light), var(--accent2));
    border-radius: 50%;
    display: flex; align-items: center; justify-content: center;
    font-family: 'Playfair Display', serif;
    font-size: 22px; font-weight: 700; color: #fff;
    flex-shrink: 0;
  }

  .perfil-info h2 {
    font-family: 'Playfair Display', serif;
    font-size: 20px; font-weight: 700;
  }

  .perfil-info p {
    font-size: 13px; color: var(--text-muted); margin-top: 3px;
  }

  .perfil-meta {
    margin-left: auto;
    text-align: right;
    font-size: 12px; color: var(--text-muted);
  }

  .perfil-meta strong { display: block; color: var(--text); font-size: 14px; }

  /* ── Seção titulo ── */
  .section-title {
    font-family: 'Playfair Display', serif;
    font-size: 22px; font-weight: 700;
    margin-bottom: 6px;
    display: flex; align-items: center; gap: 10px;
  }

  .section-sub {
    font-size: 13px; color: var(--text-muted);
    margin-bottom: 24px; line-height: 1.6;
  }

  /* ── Botão adicionar ── */
  .btn-add {
    display: flex; align-items: center; gap: 8px;
    padding: 12px 22px;
    background: var(--accent);
    color: #fff;
    border: none; border-radius: 8px;
    font-family: 'DM Sans', sans-serif;
    font-size: 14px; font-weight: 600;
    cursor: pointer;
    transition: all 0.2s;
    margin-bottom: 24px;
  }

  .btn-add:hover {
    background: #7a5c30;
    transform: translateY(-1px);
    box-shadow: 0 6px 20px rgba(138, 108, 62, 0.3);
  }

  /* ── PDI Item Card ── */
  .pdi-card {
    background: var(--surface);
    border: 1px solid var(--border);
    border-radius: var(--radius);
    margin-bottom: 16px;
    box-shadow: var(--shadow);
    overflow: hidden;
    transition: border-color 0.2s;
  }

  .pdi-card:hover { border-color: var(--accent-light); }

  .pdi-card.concluido { border-left: 4px solid var(--green); }
  .pdi-card.em-andamento { border-left: 4px solid var(--accent-light); }

  .pdi-card-header {
    padding: 18px 22px;
    display: flex; align-items: center; gap: 12px;
    cursor: pointer;
    user-select: none;
  }

  .pdi-num {
    width: 30px; height: 30px;
    background: var(--surface2);
    border-radius: 50%;
    display: flex; align-items: center; justify-content: center;
    font-size: 12px; font-weight: 700;
    color: var(--text-muted);
    flex-shrink: 0;
  }

  .pdi-card.concluido .pdi-num { background: var(--green-bg); color: var(--green); }
  .pdi-card.em-andamento .pdi-num { background: rgba(201, 169, 110, 0.15); color: var(--accent); }

  .pdi-titulo-wrap { flex: 1; }

  .pdi-oque {
    font-family: 'Playfair Display', serif;
    font-size: 16px; font-weight: 600;
    color: var(--text);
    line-height: 1.3;
  }

  .pdi-oque.vazio { color: var(--text-muted); font-style: italic; font-family: 'DM Sans', sans-serif; font-weight: 400; font-size: 14px; }

  .pdi-badges {
    display: flex; flex-wrap: wrap; gap: 6px; margin-top: 5px;
  }

  .badge {
    font-size: 11px; padding: 2px 8px; border-radius: 20px;
    font-weight: 500;
  }

  .badge-quando { background: rgba(90, 74, 124, 0.12); color: var(--accent2); }
  .badge-valor { background: rgba(138, 108, 62, 0.12); color: var(--accent); }
  .badge-status-c { background: var(--green-bg); color: var(--green); }
  .badge-status-a { background: rgba(201, 169, 110, 0.15); color: #8a6c3e; }
  .badge-status-p { background: var(--surface2); color: var(--text-muted); }

  .pdi-chevron {
    font-size: 18px; color: var(--text-muted);
    transition: transform 0.25s;
    flex-shrink: 0;
  }

  .pdi-card.open .pdi-chevron { transform: rotate(180deg); }

  /* ── PDI Body (formulário expansível) ── */
  .pdi-body {
    display: none;
    padding: 0 22px 22px;
    border-top: 1px solid var(--border);
    padding-top: 20px;
    animation: slideDown 0.2s ease;
  }

  .pdi-card.open .pdi-body { display: block; }

  @keyframes slideDown {
    from { opacity: 0; transform: translateY(-6px); }
    to { opacity: 1; transform: translateY(0); }
  }

  .fields-grid {
    display: grid;
    grid-template-columns: 1fr 1fr;
    gap: 16px;
    margin-bottom: 16px;
  }

  .field-full { grid-column: 1/-1; }

  .field-group label {
    display: block;
    font-size: 11px; font-weight: 600;
    color: var(--text-muted);
    text-transform: uppercase; letter-spacing: 0.8px;
    margin-bottom: 6px;
  }

  .field-group label .field-icon { margin-right: 4px; }

  textarea, input[type="text"], input[type="date"], select {
    width: 100%;
    border: 1px solid var(--border);
    border-radius: 8px;
    padding: 10px 13px;
    font-family: 'DM Sans', sans-serif;
    font-size: 14px;
    color: var(--text);
    background: var(--surface);
    outline: none;
    transition: border-color 0.2s, box-shadow 0.2s;
    resize: vertical;
  }

  textarea:focus, input:focus, select:focus {
    border-color: var(--accent);
    box-shadow: 0 0 0 3px rgba(138, 108, 62, 0.1);
  }

  textarea { min-height: 80px; }

  .acomp-area { min-height: 100px; background: #fffef9; }

  /* Acompanhamento histórico */
  .acomp-history {
    margin-top: 12px;
  }

  .acomp-entry {
    background: var(--surface2);
    border-radius: 8px;
    padding: 10px 13px;
    margin-bottom: 8px;
    font-size: 13px; line-height: 1.6;
    border-left: 3px solid var(--accent-light);
  }

  .acomp-entry .ae-date {
    font-size: 11px; color: var(--text-muted); margin-bottom: 3px;
    font-weight: 500;
  }

  .acomp-actions {
    display: flex; gap: 10px; margin-top: 8px;
  }

  /* Card actions */
  .card-actions {
    display: flex; gap: 10px; margin-top: 16px;
    padding-top: 16px;
    border-top: 1px solid var(--border);
    flex-wrap: wrap;
  }

  .btn-save {
    padding: 10px 20px;
    background: var(--accent);
    color: #fff;
    border: none; border-radius: 8px;
    font-family: 'DM Sans', sans-serif;
    font-size: 13px; font-weight: 600;
    cursor: pointer;
    transition: all 0.2s;
  }

  .btn-save:hover { background: #7a5c30; }

  .btn-outline {
    padding: 10px 16px;
    background: transparent;
    border: 1px solid var(--border);
    border-radius: 8px;
    font-family: 'DM Sans', sans-serif;
    font-size: 13px; font-weight: 500;
    color: var(--text-muted);
    cursor: pointer;
    transition: all 0.2s;
  }

  .btn-outline:hover { border-color: var(--text-muted); color: var(--text); }

  .btn-delete {
    padding: 10px 14px;
    background: var(--red-bg);
    border: 1px solid rgba(192,57,43,0.2);
    border-radius: 8px;
    font-size: 13px;
    color: var(--red);
    cursor: pointer;
    margin-left: auto;
    font-family: 'DM Sans', sans-serif;
    font-weight: 500;
    transition: all 0.2s;
  }

  .btn-delete:hover { background: #fde8e5; }

  /* ── Tela de erro ── */
  .error-screen {
    min-height: 80vh;
    display: flex; align-items: center; justify-content: center;
    flex-direction: column; text-align: center; gap: 12px;
    padding: 40px;
  }

  .error-screen .es-icon { font-size: 48px; margin-bottom: 8px; }
  .error-screen h2 { font-family: 'Playfair Display', serif; font-size: 24px; }
  .error-screen p { color: var(--text-muted); font-size: 15px; line-height: 1.7; max-width: 400px; }

  /* ── Progresso ── */
  .progress-bar-wrap {
    background: var(--surface);
    border: 1px solid var(--border);
    border-radius: var(--radius);
    padding: 18px 22px;
    margin-bottom: 24px;
    box-shadow: var(--shadow);
    display: flex; align-items: center; gap: 16px;
  }

  .progress-info { flex: 1; }
  .progress-info h3 { font-size: 14px; font-weight: 600; margin-bottom: 8px; }

  .bar-track {
    background: var(--surface2);
    border-radius: 4px; height: 8px; overflow: hidden;
  }

  .bar-fill {
    height: 100%;
    background: linear-gradient(90deg, var(--accent), var(--accent2));
    border-radius: 4px;
    transition: width 0.5s ease;
  }

  .progress-pct {
    font-family: 'Playfair Display', serif;
    font-size: 24px; font-weight: 700;
    color: var(--accent);
  }

  /* ── Toast ── */
  .toast {
    position: fixed; bottom: 28px; right: 28px;
    background: var(--text);
    color: #fff;
    border-radius: 10px;
    padding: 12px 20px;
    font-size: 13px;
    display: flex; align-items: center; gap: 8px;
    transform: translateY(60px); opacity: 0;
    transition: all 0.3s cubic-bezier(0.34, 1.56, 0.64, 1);
    z-index: 999;
    box-shadow: 0 6px 24px rgba(0,0,0,0.18);
  }

  .toast.show { transform: translateY(0); opacity: 1; }

  @media (max-width: 640px) {
    .fields-grid { grid-template-columns: 1fr; }
    .field-full { grid-column: 1; }
    .perfil-card { flex-wrap: wrap; }
    .perfil-meta { margin-left: 0; text-align: left; }
    header { padding: 0 16px; }
    .container { padding: 24px 16px 60px; }
    .header-inner { padding: 16px 0; }
    .codigo-pill { display: none; }
  }
</style>
</head>
<body>

<header>
  <div class="header-inner">
    <div class="logo-badge">P</div>
    <div class="header-text">
      <h1>Plano de Desenvolvimento Individual</h1>
      <span>PDI Mentoria</span>
    </div>
    <div class="codigo-pill" id="codigoPill">—</div>
  </div>
</header>

<div class="container" id="mainContainer">
  <!-- Conteúdo injetado via JS -->
</div>

<div class="toast" id="toast">
  <span id="toastIcon">✓</span>
  <span id="toastMsg">Salvo!</span>
</div>

<script>
// ==========================================
// Helpers
// ==========================================
function getParam(key) {
  return new URLSearchParams(window.location.search).get(key);
}

function storageKey(codigo) {
  return `pdi_dados_${codigo}`;
}

function carregarDados(codigo) {
  return JSON.parse(localStorage.getItem(storageKey(codigo)) || '{"itens":[]}');
}

function salvarDados(codigo, dados) {
  localStorage.setItem(storageKey(codigo), JSON.stringify(dados));
}

function getMentorandoPorCodigo(codigo) {
  const lista = JSON.parse(localStorage.getItem('pdi_mentorandos') || '[]');
  return lista.find(m => m.codigo === codigo) || null;
}

let toastTimer;
function showToast(msg, icon = '✓') {
  const t = document.getElementById('toast');
  document.getElementById('toastMsg').textContent = msg;
  document.getElementById('toastIcon').textContent = icon;
  t.classList.add('show');
  clearTimeout(toastTimer);
  toastTimer = setTimeout(() => t.classList.remove('show'), 2800);
}

// ==========================================
// Estado
// ==========================================
const codigo = getParam('codigo');
let dados = { itens: [] };

// ==========================================
// Render principal
// ==========================================
function init() {
  const container = document.getElementById('mainContainer');

  if (!codigo) {
    container.innerHTML = `
      <div class="error-screen">
        <div class="es-icon">🔑</div>
        <h2>Link inválido</h2>
        <p>Este link não contém um código de mentorando. Solicite ao seu mentor o link correto.</p>
      </div>`;
    return;
  }

  document.getElementById('codigoPill').textContent = codigo;

  dados = carregarDados(codigo);
  const mentorando = getMentorandoPorCodigo(codigo);

  const nomeExibido = mentorando ? mentorando.nome : 'Mentorando';
  const iniciais = nomeExibido.split(' ').map(p => p[0]).join('').slice(0, 2).toUpperCase();
  const emailExibido = mentorando ? mentorando.email : '—';
  const nascExibido = mentorando
    ? new Date(mentorando.nascimento + 'T00:00:00').toLocaleDateString('pt-BR')
    : '—';

  container.innerHTML = `
    <div class="perfil-card">
      <div class="avatar">${iniciais}</div>
      <div class="perfil-info">
        <h2>${nomeExibido}</h2>
        <p>${emailExibido}</p>
      </div>
      <div class="perfil-meta">
        <strong>${codigo}</strong>
        Código do mentorando
      </div>
    </div>

    <div id="progressWrap"></div>

    <div class="section-title">✦ Meu PDI</div>
    <p class="section-sub">
      Registre seus compromissos de desenvolvimento. Clique em cada item para ver e preencher os detalhes.<br>
      Atualize o acompanhamento sempre que avançar ou concluir uma ação.
    </p>

    <button class="btn-add" onclick="adicionarItem()">
      <span style="font-size:18px">+</span> Adicionar ação de desenvolvimento
    </button>

    <div id="pdiList"></div>
  `;

  renderLista();
}

// ==========================================
// Progresso
// ==========================================
function renderProgress() {
  const total = dados.itens.length;
  const concluidos = dados.itens.filter(i => i.status === 'concluido').length;
  const pct = total === 0 ? 0 : Math.round((concluidos / total) * 100);

  const wrap = document.getElementById('progressWrap');
  if (!wrap || total === 0) { if (wrap) wrap.innerHTML = ''; return; }

  wrap.innerHTML = `
    <div class="progress-bar-wrap">
      <div class="progress-info">
        <h3>${concluidos} de ${total} ações concluídas</h3>
        <div class="bar-track">
          <div class="bar-fill" style="width:${pct}%"></div>
        </div>
      </div>
      <div class="progress-pct">${pct}%</div>
    </div>`;
}

// ==========================================
// Lista de itens
// ==========================================
function renderLista() {
  renderProgress();
  const el = document.getElementById('pdiList');
  if (!el) return;

  if (dados.itens.length === 0) {
    el.innerHTML = `<div style="text-align:center;padding:40px 20px;color:var(--text-muted);font-size:14px;">
      Nenhuma ação ainda. Clique em "Adicionar" para começar seu PDI.
    </div>`;
    return;
  }

  el.innerHTML = dados.itens.map((item, idx) => {
    const statusClass = item.status === 'concluido' ? 'concluido'
      : item.status === 'andamento' ? 'em-andamento' : '';
    const badgeStatus = item.status === 'concluido'
      ? `<span class="badge badge-status-c">✓ Concluído</span>`
      : item.status === 'andamento'
      ? `<span class="badge badge-status-a">⏳ Em andamento</span>`
      : `<span class="badge badge-status-p">Pendente</span>`;
    const badgeQuando = item.quando ? `<span class="badge badge-quando">📅 ${item.quando}</span>` : '';
    const badgeValor = item.quanto ? `<span class="badge badge-valor">💰 ${item.quanto}</span>` : '';

    const historicoHTML = (item.acompanhamentos || []).map(a => `
      <div class="acomp-entry">
        <div class="ae-date">${a.data}</div>
        <div>${escapeHTML(a.texto)}</div>
      </div>`).join('');

    return `
      <div class="pdi-card ${statusClass}" id="card_${idx}">
        <div class="pdi-card-header" onclick="toggleCard(${idx})">
          <div class="pdi-num">${item.status === 'concluido' ? '✓' : idx + 1}</div>
          <div class="pdi-titulo-wrap">
            <div class="pdi-oque ${item.oque ? '' : 'vazio'}">${item.oque || 'Nova ação de desenvolvimento...'}</div>
            <div class="pdi-badges">${badgeStatus}${badgeQuando}${badgeValor}</div>
          </div>
          <div class="pdi-chevron">⌄</div>
        </div>
        <div class="pdi-body">
          <div class="fields-grid">
            <div class="field-group field-full">
              <label><span class="field-icon">🎯</span> O Quê — Qual é a ação ou competência a desenvolver?</label>
              <textarea id="oque_${idx}" placeholder="Descreva claramente o que você vai desenvolver ou conquistar...">${item.oque || ''}</textarea>
            </div>
            <div class="field-group field-full">
              <label><span class="field-icon">🛠</span> Como — De que forma você vai alcançar isso?</label>
              <textarea id="como_${idx}" placeholder="Cursos, leituras, práticas, mentorias, projetos...">${item.como || ''}</textarea>
            </div>
            <div class="field-group">
              <label><span class="field-icon">📅</span> Quando — Prazo ou período</label>
              <input type="text" id="quando_${idx}" placeholder="Ex: Até março de 2025" value="${item.quando || ''}">
            </div>
            <div class="field-group">
              <label><span class="field-icon">💰</span> Quanto — Investimento (se houver)</label>
              <input type="text" id="quanto_${idx}" placeholder="Ex: R$ 500 / mês" value="${item.quanto || ''}">
            </div>
            <div class="field-group field-full">
              <label><span class="field-icon">📊</span> Status</label>
              <select id="status_${idx}">
                <option value="pendente" ${(item.status||'pendente')==='pendente'?'selected':''}>⬜ Pendente</option>
                <option value="andamento" ${item.status==='andamento'?'selected':''}>⏳ Em andamento</option>
                <option value="concluido" ${item.status==='concluido'?'selected':''}>✅ Concluído</option>
              </select>
            </div>
            <div class="field-group field-full">
              <label><span class="field-icon">📝</span> Acompanhamento — Adicionar novo registro</label>
              <textarea class="acomp-area" id="novoAcomp_${idx}" placeholder="Registre um progresso, aprendizado ou atualização sobre esta ação..."></textarea>
              <div class="acomp-actions">
                <button class="btn-outline" onclick="adicionarAcompanhamento(${idx})" style="font-size:12px;padding:7px 14px;">
                  + Registrar acompanhamento
                </button>
              </div>
              ${historicoHTML ? `<div class="acomp-history">${historicoHTML}</div>` : ''}
            </div>
          </div>
          <div class="card-actions">
            <button class="btn-save" onclick="salvarItem(${idx})">💾 Salvar</button>
            <button class="btn-delete" onclick="deletarItem(${idx})">🗑 Remover</button>
          </div>
        </div>
      </div>`;
  }).join('');
}

// ==========================================
// Interações
// ==========================================
function toggleCard(idx) {
  const card = document.getElementById(`card_${idx}`);
  card.classList.toggle('open');
}

function adicionarItem() {
  dados.itens.push({
    oque: '', como: '', quando: '', quanto: '',
    status: 'pendente', acompanhamentos: []
  });
  salvarDados(codigo, dados);
  renderLista();
  // Abre o novo card
  setTimeout(() => {
    const ultimo = dados.itens.length - 1;
    const card = document.getElementById(`card_${ultimo}`);
    if (card) { card.classList.add('open'); card.scrollIntoView({ behavior: 'smooth', block: 'start' }); }
  }, 50);
}

function salvarItem(idx) {
  dados.itens[idx].oque    = document.getElementById(`oque_${idx}`).value.trim();
  dados.itens[idx].como    = document.getElementById(`como_${idx}`).value.trim();
  dados.itens[idx].quando  = document.getElementById(`quando_${idx}`).value.trim();
  dados.itens[idx].quanto  = document.getElementById(`quanto_${idx}`).value.trim();
  dados.itens[idx].status  = document.getElementById(`status_${idx}`).value;
  salvarDados(codigo, dados);
  renderLista();
  // Reabre o card salvo
  setTimeout(() => {
    const card = document.getElementById(`card_${idx}`);
    if (card) card.classList.add('open');
  }, 30);
  showToast('Ação salva com sucesso!', '✓');
}

function adicionarAcompanhamento(idx) {
  const texto = document.getElementById(`novoAcomp_${idx}`).value.trim();
  if (!texto) { showToast('Digite algo antes de registrar.', '⚠'); return; }

  const agora = new Date().toLocaleString('pt-BR', {
    day: '2-digit', month: '2-digit', year: 'numeric',
    hour: '2-digit', minute: '2-digit'
  });

  if (!dados.itens[idx].acompanhamentos) dados.itens[idx].acompanhamentos = [];
  dados.itens[idx].acompanhamentos.unshift({ data: agora, texto });
  salvarDados(codigo, dados);
  renderLista();
  setTimeout(() => {
    const card = document.getElementById(`card_${idx}`);
    if (card) card.classList.add('open');
  }, 30);
  showToast('Acompanhamento registrado!', '📝');
}

function deletarItem(idx) {
  if (!confirm('Remover esta ação do seu PDI?')) return;
  dados.itens.splice(idx, 1);
  salvarDados(codigo, dados);
  renderLista();
  showToast('Ação removida.', '🗑');
}

function escapeHTML(str) {
  return str.replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/\n/g,'<br>');
}

// ==========================================
// Start
// ==========================================
init();
</script>
</body>
</html>
