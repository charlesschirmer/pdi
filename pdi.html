<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Meu PDI — Plano de Desenvolvimento Individual</title>
<link href="https://fonts.googleapis.com/css2?family=Playfair+Display:ital,wght@0,400;0,600;0,700;1,400&family=DM+Sans:wght@300;400;500;600&display=swap" rel="stylesheet">
<style>
  :root {
    --bg:#f9f7f4; --surface:#ffffff; --surface2:#f3f1ee; --border:#e2ddd8;
    --accent:#8a6c3e; --accent-light:#c9a96e; --accent2:#5a4a7c;
    --text:#1e1a14; --text-muted:#7a736a;
    --green:#2d7a5a; --green-bg:#edf7f2;
    --red:#c0392b; --red-bg:#fef0ee;
    --radius:12px; --shadow:0 2px 16px rgba(0,0,0,0.06);
  }
  *{margin:0;padding:0;box-sizing:border-box;}
  body{background:var(--bg);color:var(--text);font-family:'DM Sans',sans-serif;min-height:100vh;}

  header{background:var(--surface);border-bottom:2px solid var(--border);padding:0 40px;}
  .header-inner{max-width:860px;margin:0 auto;padding:22px 0;display:flex;align-items:center;gap:14px;}
  .logo-badge{
    width:44px;height:44px;
    background:linear-gradient(135deg,var(--accent),var(--accent2));
    border-radius:10px;display:flex;align-items:center;justify-content:center;
    font-family:'Playfair Display',serif;font-weight:700;font-size:20px;color:#fff;
  }
  .header-text h1{font-family:'Playfair Display',serif;font-size:19px;font-weight:700;}
  .header-text span{font-size:12px;color:var(--text-muted);}
  .header-right{margin-left:auto;display:flex;align-items:center;gap:10px;}
  .sync-indicator{
    display:flex;align-items:center;gap:7px;font-size:12px;color:var(--text-muted);
    background:var(--surface2);border:1px solid var(--border);
    padding:5px 13px;border-radius:20px;
  }
  .sync-dot{width:7px;height:7px;border-radius:50%;background:var(--text-muted);transition:background 0.3s;}
  .sync-dot.ok{background:var(--green);}
  .sync-dot.busy{background:var(--accent-light);animation:pulse 1s infinite;}
  .sync-dot.err{background:var(--red);}
  @keyframes pulse{0%,100%{opacity:1}50%{opacity:0.3}}
  .codigo-pill{
    background:var(--surface2);border:1px solid var(--border);
    padding:6px 16px;border-radius:20px;
    font-family:'Courier New',monospace;font-size:13px;font-weight:700;color:var(--accent);letter-spacing:1px;
  }

  .container{max-width:860px;margin:0 auto;padding:40px 24px 80px;}

  .perfil-card{
    background:var(--surface);border:1px solid var(--border);border-radius:var(--radius);
    padding:24px 28px;margin-bottom:32px;display:flex;align-items:center;gap:20px;box-shadow:var(--shadow);
  }
  .avatar{
    width:56px;height:56px;
    background:linear-gradient(135deg,var(--accent-light),var(--accent2));
    border-radius:50%;display:flex;align-items:center;justify-content:center;
    font-family:'Playfair Display',serif;font-size:22px;font-weight:700;color:#fff;flex-shrink:0;
  }
  .perfil-info h2{font-family:'Playfair Display',serif;font-size:20px;font-weight:700;}
  .perfil-info p{font-size:13px;color:var(--text-muted);margin-top:3px;}
  .perfil-meta{margin-left:auto;text-align:right;font-size:12px;color:var(--text-muted);}
  .perfil-meta strong{display:block;color:var(--text);font-size:14px;}

  .section-title{font-family:'Playfair Display',serif;font-size:22px;font-weight:700;margin-bottom:6px;}
  .section-sub{font-size:13px;color:var(--text-muted);margin-bottom:24px;line-height:1.6;}

  .btn-add{
    display:flex;align-items:center;gap:8px;padding:12px 22px;
    background:var(--accent);color:#fff;border:none;border-radius:8px;
    font-family:'DM Sans',sans-serif;font-size:14px;font-weight:600;cursor:pointer;
    transition:all 0.2s;margin-bottom:24px;
  }
  .btn-add:hover{background:#7a5c30;transform:translateY(-1px);box-shadow:0 6px 20px rgba(138,108,62,0.3);}
  .btn-add:disabled{opacity:0.5;cursor:not-allowed;transform:none;}

  .pdi-card{
    background:var(--surface);border:1px solid var(--border);border-radius:var(--radius);
    margin-bottom:16px;box-shadow:var(--shadow);overflow:hidden;transition:border-color 0.2s;
  }
  .pdi-card:hover{border-color:var(--accent-light);}
  .pdi-card.concluido{border-left:4px solid var(--green);}
  .pdi-card.em-andamento{border-left:4px solid var(--accent-light);}

  .pdi-card-header{padding:18px 22px;display:flex;align-items:center;gap:12px;cursor:pointer;user-select:none;}
  .pdi-num{
    width:30px;height:30px;background:var(--surface2);border-radius:50%;
    display:flex;align-items:center;justify-content:center;font-size:12px;font-weight:700;color:var(--text-muted);flex-shrink:0;
  }
  .pdi-card.concluido .pdi-num{background:var(--green-bg);color:var(--green);}
  .pdi-card.em-andamento .pdi-num{background:rgba(201,169,110,0.15);color:var(--accent);}
  .pdi-titulo-wrap{flex:1;}
  .pdi-oque{font-family:'Playfair Display',serif;font-size:16px;font-weight:600;line-height:1.3;}
  .pdi-oque.vazio{color:var(--text-muted);font-style:italic;font-family:'DM Sans',sans-serif;font-weight:400;font-size:14px;}
  .pdi-badges{display:flex;flex-wrap:wrap;gap:6px;margin-top:5px;}
  .badge{font-size:11px;padding:2px 8px;border-radius:20px;font-weight:500;}
  .badge-quando{background:rgba(90,74,124,0.12);color:var(--accent2);}
  .badge-valor{background:rgba(138,108,62,0.12);color:var(--accent);}
  .badge-status-c{background:var(--green-bg);color:var(--green);}
  .badge-status-a{background:rgba(201,169,110,0.15);color:#8a6c3e;}
  .badge-status-p{background:var(--surface2);color:var(--text-muted);}
  .pdi-chevron{font-size:18px;color:var(--text-muted);transition:transform 0.25s;flex-shrink:0;}
  .pdi-card.open .pdi-chevron{transform:rotate(180deg);}

  .pdi-body{
    display:none;padding:0 22px 22px;border-top:1px solid var(--border);
    padding-top:20px;animation:slideDown 0.2s ease;
  }
  .pdi-card.open .pdi-body{display:block;}
  @keyframes slideDown{from{opacity:0;transform:translateY(-6px)}to{opacity:1;transform:translateY(0)}}

  .fields-grid{display:grid;grid-template-columns:1fr 1fr;gap:16px;margin-bottom:16px;}
  .field-full{grid-column:1/-1;}
  .field-group label{
    display:block;font-size:11px;font-weight:600;color:var(--text-muted);
    text-transform:uppercase;letter-spacing:0.8px;margin-bottom:6px;
  }
  textarea,input[type="text"],input[type="date"],select{
    width:100%;border:1px solid var(--border);border-radius:8px;padding:10px 13px;
    font-family:'DM Sans',sans-serif;font-size:14px;color:var(--text);background:var(--surface);
    outline:none;transition:border-color 0.2s,box-shadow 0.2s;resize:vertical;
  }
  textarea:focus,input:focus,select:focus{border-color:var(--accent);box-shadow:0 0 0 3px rgba(138,108,62,0.1);}
  textarea{min-height:80px;}
  .acomp-area{min-height:90px;background:#fffef9;}

  .acomp-history{margin-top:12px;}
  .acomp-entry{
    background:var(--surface2);border-radius:8px;padding:10px 13px;margin-bottom:8px;
    font-size:13px;line-height:1.6;border-left:3px solid var(--accent-light);
  }
  .ae-date{font-size:11px;color:var(--text-muted);margin-bottom:3px;font-weight:500;}
  .acomp-add-btn{
    padding:7px 14px;background:transparent;border:1px solid var(--border);border-radius:8px;
    font-family:'DM Sans',sans-serif;font-size:12px;font-weight:500;color:var(--text-muted);
    cursor:pointer;transition:all 0.2s;margin-top:8px;
  }
  .acomp-add-btn:hover{border-color:var(--text-muted);color:var(--text);}

  .card-actions{
    display:flex;gap:10px;margin-top:16px;padding-top:16px;
    border-top:1px solid var(--border);flex-wrap:wrap;
  }
  .btn-save{
    padding:10px 20px;background:var(--accent);color:#fff;
    border:none;border-radius:8px;font-family:'DM Sans',sans-serif;
    font-size:13px;font-weight:600;cursor:pointer;transition:all 0.2s;
  }
  .btn-save:hover{background:#7a5c30;}
  .btn-save:disabled{opacity:0.5;cursor:not-allowed;}
  .btn-delete{
    padding:10px 14px;background:var(--red-bg);border:1px solid rgba(192,57,43,0.2);
    border-radius:8px;font-size:13px;color:var(--red);cursor:pointer;
    margin-left:auto;font-family:'DM Sans',sans-serif;font-weight:500;transition:all 0.2s;
  }
  .btn-delete:hover{background:#fde8e5;}

  .progress-bar-wrap{
    background:var(--surface);border:1px solid var(--border);border-radius:var(--radius);
    padding:18px 22px;margin-bottom:24px;box-shadow:var(--shadow);
    display:flex;align-items:center;gap:16px;
  }
  .progress-info{flex:1;}
  .progress-info h3{font-size:14px;font-weight:600;margin-bottom:8px;}
  .bar-track{background:var(--surface2);border-radius:4px;height:8px;overflow:hidden;}
  .bar-fill{height:100%;background:linear-gradient(90deg,var(--accent),var(--accent2));border-radius:4px;transition:width 0.5s ease;}
  .progress-pct{font-family:'Playfair Display',serif;font-size:24px;font-weight:700;color:var(--accent);}

  /* Loading overlay */
  .loading-overlay{
    position:fixed;inset:0;background:rgba(249,247,244,0.9);
    display:flex;flex-direction:column;align-items:center;justify-content:center;
    z-index:500;gap:16px;
  }
  .loading-overlay.hidden{display:none;}
  .spinner{
    width:36px;height:36px;border:3px solid var(--border);
    border-top-color:var(--accent);border-radius:50%;animation:spin 0.8s linear infinite;
  }
  @keyframes spin{to{transform:rotate(360deg)}}
  .loading-overlay p{font-size:14px;color:var(--text-muted);}

  .error-screen{
    min-height:70vh;display:flex;align-items:center;justify-content:center;
    flex-direction:column;text-align:center;gap:12px;padding:40px;
  }
  .error-screen .es-icon{font-size:48px;margin-bottom:8px;}
  .error-screen h2{font-family:'Playfair Display',serif;font-size:24px;}
  .error-screen p{color:var(--text-muted);font-size:15px;line-height:1.7;max-width:400px;}

  .toast{
    position:fixed;bottom:28px;right:28px;background:var(--text);color:#fff;
    border-radius:10px;padding:12px 20px;font-size:13px;
    display:flex;align-items:center;gap:8px;
    transform:translateY(60px);opacity:0;
    transition:all 0.3s cubic-bezier(0.34,1.56,0.64,1);
    z-index:999;box-shadow:0 6px 24px rgba(0,0,0,0.18);
  }
  .toast.show{transform:translateY(0);opacity:1;}

  @media(max-width:640px){
    .fields-grid{grid-template-columns:1fr;}
    .field-full{grid-column:1;}
    .perfil-card{flex-wrap:wrap;}
    .perfil-meta{margin-left:0;text-align:left;}
    header{padding:0 16px;}
    .container{padding:24px 16px 60px;}
    .header-inner{padding:16px 0;}
    .codigo-pill{display:none;}
  }
</style>
</head>
<body>

<div class="loading-overlay" id="loadingOverlay">
  <div class="spinner"></div>
  <p id="loadingMsg">Carregando seu PDI...</p>
</div>

<header>
  <div class="header-inner">
    <div class="logo-badge">P</div>
    <div class="header-text">
      <h1>Plano de Desenvolvimento Individual</h1>
      <span>PDI Mentoria</span>
    </div>
    <div class="header-right">
      <div class="sync-indicator">
        <div class="sync-dot" id="syncDot"></div>
        <span id="syncLabel">Conectando...</span>
      </div>
      <div class="codigo-pill" id="codigoPill">—</div>
    </div>
  </div>
</header>

<div class="container" id="mainContainer"></div>

<div class="toast" id="toast">
  <span id="toastIcon">✓</span>
  <span id="toastMsg">Salvo!</span>
</div>

<script>
// ══════════════════════════════════════════
// CONFIG — embutido
// ══════════════════════════════════════════
const GIST_ID    = '4f26b75fa486624b670a1f6ea5c323be';
const GIST_TOKEN = ['ghp_jSq2mclCnytKETCH34','HT0z37odH1A1314XhE'].join('');
const GIST_FILE  = 'pdi_mentoria.json';

// ══════════════════════════════════════════
// Gist API
// ══════════════════════════════════════════
async function gistGet() {
  const r = await fetch(`https://api.github.com/gists/${GIST_ID}`, {
    headers:{'Authorization':`token ${GIST_TOKEN}`,'Accept':'application/vnd.github.v3+json'}
  });
  if (!r.ok) throw new Error('Falha ao ler Gist: '+r.status);
  const data = await r.json();
  const raw = data.files[GIST_FILE]?.content || '{"mentorandos":[],"pdis":{}}';
  return JSON.parse(raw);
}

async function gistSet(payload) {
  const r = await fetch(`https://api.github.com/gists/${GIST_ID}`, {
    method:'PATCH',
    headers:{'Authorization':`token ${GIST_TOKEN}`,'Accept':'application/vnd.github.v3+json','Content-Type':'application/json'},
    body: JSON.stringify({files:{[GIST_FILE]:{content:JSON.stringify(payload,null,2)}}})
  });
  if (!r.ok) throw new Error('Falha ao salvar: '+r.status);
}

// ══════════════════════════════════════════
// Estado
// ══════════════════════════════════════════
const codigo = new URLSearchParams(window.location.search).get('codigo');
let db  = { mentorandos:[], pdis:{} };
let itens = [];   // db.pdis[codigo] ?? []

function setSyncStatus(estado) {
  const dot = document.getElementById('syncDot');
  const lbl = document.getElementById('syncLabel');
  dot.className='sync-dot';
  if(estado==='ok')  {dot.classList.add('ok');  lbl.textContent='Sincronizado';}
  if(estado==='busy'){dot.classList.add('busy'); lbl.textContent='Salvando...';}
  if(estado==='err') {dot.classList.add('err');  lbl.textContent='Erro de sync';}
}

// ══════════════════════════════════════════
// Persistir itens no Gist
// ══════════════════════════════════════════
async function persistir() {
  setSyncStatus('busy');
  try {
    db = await gistGet();          // leitura fresca para não sobrescrever outros mentorandos
    if (!db.pdis) db.pdis = {};
    db.pdis[codigo] = itens;
    await gistSet(db);
    setSyncStatus('ok');
  } catch(e) {
    setSyncStatus('err');
    showToast('Erro ao sincronizar: '+e.message,'err');
    throw e;
  }
}

// ══════════════════════════════════════════
// Init
// ══════════════════════════════════════════
async function init() {
  const container = document.getElementById('mainContainer');

  if (!codigo) {
    document.getElementById('loadingOverlay').classList.add('hidden');
    container.innerHTML=`<div class="error-screen">
      <div class="es-icon">🔑</div><h2>Link inválido</h2>
      <p>Este link não contém um código de mentorando.<br>Solicite ao seu mentor o link correto.</p>
    </div>`;
    return;
  }

  document.getElementById('codigoPill').textContent = codigo;

  try {
    db = await gistGet();
    itens = (db.pdis && db.pdis[codigo]) ? db.pdis[codigo] : [];
    setSyncStatus('ok');
  } catch(e) {
    setSyncStatus('err');
    showToast('Erro ao carregar dados.','err');
  } finally {
    document.getElementById('loadingOverlay').classList.add('hidden');
  }

  const mentorando = (db.mentorandos||[]).find(m=>m.codigo===codigo);
  const nomeExibido= mentorando ? mentorando.nome : codigo;
  const iniciais   = nomeExibido.split(' ').map(p=>p[0]).join('').slice(0,2).toUpperCase();

  container.innerHTML=`
    <div class="perfil-card">
      <div class="avatar">${iniciais}</div>
      <div class="perfil-info">
        <h2>${nomeExibido}</h2>
        <p>${mentorando?.email||''}</p>
      </div>
      <div class="perfil-meta">
        <strong>${codigo}</strong>Código do mentorando
      </div>
    </div>
    <div id="progressWrap"></div>
    <div class="section-title">✦ Meu PDI</div>
    <p class="section-sub">Registre seus compromissos de desenvolvimento. Clique em cada item para ver e editar os detalhes.<br>
    Atualize o acompanhamento sempre que avançar.</p>
    <button class="btn-add" id="btnAdicionar" onclick="adicionarItem()">
      <span style="font-size:18px">+</span> Adicionar ação de desenvolvimento
    </button>
    <div id="pdiList"></div>`;

  renderLista();
}

// ══════════════════════════════════════════
// Progresso
// ══════════════════════════════════════════
function renderProgress() {
  const total = itens.length;
  const conc  = itens.filter(i=>i.status==='concluido').length;
  const pct   = total===0 ? 0 : Math.round(conc/total*100);
  const wrap  = document.getElementById('progressWrap');
  if (!wrap || total===0){if(wrap)wrap.innerHTML=''; return;}
  wrap.innerHTML=`<div class="progress-bar-wrap">
    <div class="progress-info">
      <h3>${conc} de ${total} ações concluídas</h3>
      <div class="bar-track"><div class="bar-fill" style="width:${pct}%"></div></div>
    </div>
    <div class="progress-pct">${pct}%</div>
  </div>`;
}

// ══════════════════════════════════════════
// Render lista
// ══════════════════════════════════════════
function renderLista() {
  renderProgress();
  const el = document.getElementById('pdiList');
  if (!el) return;
  if (itens.length===0){
    el.innerHTML=`<div style="text-align:center;padding:40px 20px;color:var(--text-muted);font-size:14px;">
      Nenhuma ação ainda. Clique em "Adicionar" para começar seu PDI.</div>`;
    return;
  }
  el.innerHTML = itens.map((item,idx) => {
    const sc = item.status==='concluido' ? 'concluido' : item.status==='andamento' ? 'em-andamento' : '';
    const bs = item.status==='concluido'
      ? `<span class="badge badge-status-c">✓ Concluído</span>`
      : item.status==='andamento'
      ? `<span class="badge badge-status-a">⏳ Em andamento</span>`
      : `<span class="badge badge-status-p">Pendente</span>`;
    const bq = item.quando ? `<span class="badge badge-quando">📅 ${item.quando}</span>` : '';
    const bv = item.quanto ? `<span class="badge badge-valor">💰 ${item.quanto}</span>` : '';
    const hist = (item.acompanhamentos||[]).map(a=>`
      <div class="acomp-entry">
        <div class="ae-date">${a.data}</div>
        <div>${esc(a.texto)}</div>
      </div>`).join('');
    return `
    <div class="pdi-card ${sc}" id="card_${idx}">
      <div class="pdi-card-header" onclick="toggleCard(${idx})">
        <div class="pdi-num">${item.status==='concluido'?'✓':idx+1}</div>
        <div class="pdi-titulo-wrap">
          <div class="pdi-oque ${item.oque?'':'vazio'}">${item.oque||'Nova ação de desenvolvimento...'}</div>
          <div class="pdi-badges">${bs}${bq}${bv}</div>
        </div>
        <div class="pdi-chevron">⌄</div>
      </div>
      <div class="pdi-body">
        <div class="fields-grid">
          <div class="field-group field-full">
            <label>🎯 O Quê — Qual é a ação ou competência a desenvolver?</label>
            <textarea id="oque_${idx}" placeholder="Descreva o que você vai desenvolver ou conquistar...">${item.oque||''}</textarea>
          </div>
          <div class="field-group field-full">
            <label>🛠 Como — De que forma você vai alcançar isso?</label>
            <textarea id="como_${idx}" placeholder="Cursos, leituras, práticas, mentorias, projetos...">${item.como||''}</textarea>
          </div>
          <div class="field-group">
            <label>📅 Quando — Prazo ou período</label>
            <input type="text" id="quando_${idx}" placeholder="Ex: Até março de 2026" value="${item.quando||''}">
          </div>
          <div class="field-group">
            <label>💰 Quanto — Investimento (se houver)</label>
            <input type="text" id="quanto_${idx}" placeholder="Ex: R$ 500 / mês" value="${item.quanto||''}">
          </div>
          <div class="field-group field-full">
            <label>📊 Status</label>
            <select id="status_${idx}">
              <option value="pendente"  ${(item.status||'pendente')==='pendente' ?'selected':''}>⬜ Pendente</option>
              <option value="andamento" ${item.status==='andamento'?'selected':''}>⏳ Em andamento</option>
              <option value="concluido" ${item.status==='concluido'?'selected':''}>✅ Concluído</option>
            </select>
          </div>
          <div class="field-group field-full">
            <label>📝 Acompanhamento — Novo registro</label>
            <textarea class="acomp-area" id="novoAcomp_${idx}" placeholder="Registre um progresso, aprendizado ou atualização..."></textarea>
            <button class="acomp-add-btn" onclick="adicionarAcomp(${idx})">+ Registrar acompanhamento</button>
            ${hist ? `<div class="acomp-history">${hist}</div>` : ''}
          </div>
        </div>
        <div class="card-actions">
          <button class="btn-save" id="btnSave_${idx}" onclick="salvarItem(${idx})">💾 Salvar</button>
          <button class="btn-delete" onclick="deletarItem(${idx})">🗑 Remover</button>
        </div>
      </div>
    </div>`;
  }).join('');
}

// ══════════════════════════════════════════
// Ações
// ══════════════════════════════════════════
function toggleCard(idx) {
  document.getElementById('card_'+idx).classList.toggle('open');
}

async function adicionarItem() {
  const btn = document.getElementById('btnAdicionar');
  btn.disabled=true;
  itens.push({oque:'',como:'',quando:'',quanto:'',status:'pendente',acompanhamentos:[]});
  try {
    await persistir();
    renderLista();
    setTimeout(()=>{
      const c=document.getElementById('card_'+(itens.length-1));
      if(c){c.classList.add('open');c.scrollIntoView({behavior:'smooth',block:'start'});}
    },50);
  } catch(_) { itens.pop(); renderLista(); }
  finally { btn.disabled=false; }
}

async function salvarItem(idx) {
  const btn = document.getElementById('btnSave_'+idx);
  if(btn) btn.disabled=true;
  itens[idx].oque   = document.getElementById('oque_'+idx).value.trim();
  itens[idx].como   = document.getElementById('como_'+idx).value.trim();
  itens[idx].quando = document.getElementById('quando_'+idx).value.trim();
  itens[idx].quanto = document.getElementById('quanto_'+idx).value.trim();
  itens[idx].status = document.getElementById('status_'+idx).value;
  try {
    await persistir();
    renderLista();
    setTimeout(()=>{
      const c=document.getElementById('card_'+idx);
      if(c) c.classList.add('open');
    },30);
    showToast('Ação salva e sincronizada!','ok');
  } catch(_) {}
  finally { if(btn) btn.disabled=false; }
}

async function adicionarAcomp(idx) {
  const txt = document.getElementById('novoAcomp_'+idx).value.trim();
  if(!txt){showToast('Digite algo antes de registrar.','warn');return;}
  const agora = new Date().toLocaleString('pt-BR',{day:'2-digit',month:'2-digit',year:'numeric',hour:'2-digit',minute:'2-digit'});
  if(!itens[idx].acompanhamentos) itens[idx].acompanhamentos=[];
  itens[idx].acompanhamentos.unshift({data:agora,texto:txt});
  try {
    await persistir();
    renderLista();
    setTimeout(()=>{ const c=document.getElementById('card_'+idx); if(c) c.classList.add('open'); },30);
    showToast('Acompanhamento registrado!','ok');
  } catch(_) {}
}

async function deletarItem(idx) {
  if(!confirm('Remover esta ação do seu PDI?')) return;
  itens.splice(idx,1);
  try { await persistir(); } catch(_) {}
  renderLista();
  showToast('Ação removida.','ok');
}

function esc(s){ return s.replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/\n/g,'<br>'); }

// ══════════════════════════════════════════
// Toast
// ══════════════════════════════════════════
let toastTimer;
function showToast(msg, tipo='ok') {
  const t=document.getElementById('toast');
  const icons={ok:'✓',err:'✕',warn:'⚠'};
  document.getElementById('toastMsg').textContent=msg;
  document.getElementById('toastIcon').textContent=icons[tipo]||'✓';
  t.classList.add('show');
  clearTimeout(toastTimer);
  toastTimer=setTimeout(()=>t.classList.remove('show'),3000);
}

init();
</script>
