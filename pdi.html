<style>
  :root{
    --bg:#015a61;
    --surface:#02777e;
    --surface2:#028a92;
    --border:#03a0aa;
    --accent:#4eddc1;
    --accent-light:#6af0d7;
    --accent2:#005d64;
    --text:#e8fffe;
    --text-muted:#7dd4cc;
    --green:#4eddc1;
    --green-bg:rgba(78,221,193,0.15);
    --red:#ff7070;
    --red-bg:rgba(255,112,112,0.12);
    --radius:12px;
    --shadow:0 4px 24px rgba(0,60,65,0.45);
  }
  *{margin:0;padding:0;box-sizing:border-box;}
  body{background:linear-gradient(160deg,#016970 0%,#015058 100%);min-height:100vh;color:var(--text);font-family:"DM Sans",sans-serif;min-height:100vh;}
  header{background:linear-gradient(180deg,#028a92,var(--surface));border-bottom:2px solid var(--border);padding:0 40px;}
  .header-inner{max-width:860px;margin:0 auto;padding:22px 0;display:flex;align-items:center;gap:14px;}
  .logo-badge{width:44px;height:44px;background:linear-gradient(135deg,var(--accent),var(--accent2));border-radius:10px;display:flex;align-items:center;justify-content:center;font-family:"Playfair Display",serif;font-weight:700;font-size:20px;color:#fff;}
  .header-text h1{font-family:"Playfair Display",serif;font-size:19px;font-weight:700;}
  .header-text span{font-size:12px;color:var(--text-muted);}
  .header-right{margin-left:auto;display:flex;align-items:center;gap:10px;}
  .sync-indicator{display:flex;align-items:center;gap:7px;font-size:12px;color:var(--text-muted);background:rgba(0,93,100,0.6);border:1px solid var(--border);padding:5px 13px;border-radius:20px;}
  .sync-dot{width:7px;height:7px;border-radius:50%;background:var(--text-muted);transition:background 0.3s;}
  .sync-dot.ok{background:var(--green);}
  .sync-dot.busy{background:var(--accent-light);animation:pulse 1s infinite;}
  .sync-dot.err{background:var(--red);}
  @keyframes pulse{0%,100%{opacity:1}50%{opacity:0.3}}
  .codigo-pill{background:rgba(0,93,100,0.6);border:1px solid var(--border);padding:6px 16px;border-radius:20px;font-family:"Courier New",monospace;font-size:13px;font-weight:700;color:var(--accent-light);letter-spacing:1px;}
  .container{max-width:860px;margin:0 auto;padding:40px 24px 80px;}
  .perfil-card{background:rgba(2,119,126,0.7);backdrop-filter:blur(4px);border:1px solid var(--border);border-radius:var(--radius);padding:24px 28px;margin-bottom:32px;display:flex;align-items:center;gap:20px;box-shadow:var(--shadow);}
  .avatar{width:56px;height:56px;background:linear-gradient(135deg,var(--accent),#028a92);border-radius:50%;display:flex;align-items:center;justify-content:center;font-family:"Playfair Display",serif;font-size:22px;font-weight:700;color:#fff;flex-shrink:0;}
  .perfil-info h2{font-family:"Playfair Display",serif;font-size:20px;font-weight:700;}
  .perfil-info p{font-size:13px;color:var(--text-muted);margin-top:3px;}
  .perfil-meta{margin-left:auto;text-align:right;font-size:12px;color:var(--text-muted);}
  .perfil-meta strong{display:block;color:var(--text);font-size:14px;}
  .section-title{font-family:"Playfair Display",serif;font-size:22px;font-weight:700;margin-bottom:6px;color:var(--accent-light);}
  .section-sub{font-size:13px;color:var(--text-muted);margin-bottom:24px;line-height:1.6;}
  .btn-add{display:flex;align-items:center;gap:8px;padding:12px 22px;background:linear-gradient(135deg,var(--accent),var(--accent-light));color:#015058;border:none;border-radius:8px;font-family:"DM Sans",sans-serif;font-size:14px;font-weight:600;cursor:pointer;transition:all 0.2s;margin-bottom:24px;}
  .btn-add:hover{background:var(--accent-light);transform:translateY(-1px);box-shadow:0 6px 20px rgba(78,221,193,0.4);}
  .btn-add:disabled{opacity:0.5;cursor:not-allowed;transform:none;}
  .pdi-card{background:var(--surface);border:1px solid var(--border);border-radius:var(--radius);margin-bottom:16px;box-shadow:var(--shadow);overflow:hidden;transition:border-color 0.2s;}
  .pdi-card:hover{border-color:var(--accent);}
  .pdi-card.concluido{border-left:4px solid var(--accent);}
  .pdi-card.em-andamento{border-left:4px solid #6af0d7;}
  .pdi-card-header{padding:18px 22px;display:flex;align-items:center;gap:12px;cursor:pointer;user-select:none;}
  .pdi-num{width:30px;height:30px;background:var(--surface2);border-radius:50%;display:flex;align-items:center;justify-content:center;font-size:12px;font-weight:700;color:var(--text-muted);flex-shrink:0;}
  .pdi-card.concluido .pdi-num{background:var(--green-bg);color:var(--green);}
  .pdi-card.em-andamento .pdi-num{background:rgba(78,221,193,0.2);color:var(--accent-light);}
  .pdi-titulo-wrap{flex:1;}
  .pdi-oque{font-family:"Playfair Display",serif;font-size:16px;font-weight:600;line-height:1.3;}
  .pdi-oque.vazio{color:var(--text-muted);font-style:italic;font-family:"DM Sans",sans-serif;font-weight:400;font-size:14px;}
  .pdi-badges{display:flex;flex-wrap:wrap;gap:6px;margin-top:5px;}
  .badge{font-size:11px;padding:2px 8px;border-radius:20px;font-weight:500;}
  .badge-quando{background:rgba(78,221,193,0.15);color:var(--accent-light);}
  .badge-valor{background:rgba(78,221,193,0.12);color:var(--accent);}
  .badge-status-c{background:var(--green-bg);color:var(--green);}
  .badge-status-a{background:rgba(78,221,193,0.2);color:var(--accent2);}
  .badge-status-p{background:var(--surface2);color:var(--text-muted);}
  .pdi-chevron{font-size:18px;color:var(--text-muted);transition:transform 0.25s;flex-shrink:0;}
  .pdi-card.open .pdi-chevron{transform:rotate(180deg);}
  .pdi-body{display:none;padding:20px 22px 22px;border-top:1px solid var(--border);animation:slideDown 0.2s ease;}
  .pdi-card.open .pdi-body{display:block;}
  @keyframes slideDown{from{opacity:0;transform:translateY(-6px)}to{opacity:1;transform:translateY(0)}}
  .fields-grid{display:grid;grid-template-columns:1fr 1fr;gap:16px;margin-bottom:16px;}
  .field-full{grid-column:1/-1;}
  .field-group label{display:block;font-size:11px;font-weight:600;color:var(--text-muted);text-transform:uppercase;letter-spacing:0.8px;margin-bottom:6px;}
  textarea,input[type=text],input[type=date],select{width:100%;border:1px solid var(--border);border-radius:8px;padding:10px 13px;font-family:"DM Sans",sans-serif;font-size:14px;color:#015058;background:#b8e8e4;outline:none;transition:border-color 0.2s,box-shadow 0.2s;resize:vertical;}
  textarea:focus,input:focus,select:focus{border-color:var(--accent);box-shadow:0 0 0 3px rgba(78,221,193,0.2);}
  textarea{min-height:80px;}
  .acomp-area{min-height:90px;background:#c8f0ec;}
  .acomp-history{margin-top:12px;}
  .acomp-entry{background:var(--surface2);border-radius:8px;padding:10px 13px;margin-bottom:8px;font-size:13px;line-height:1.6;border-left:3px solid var(--accent);}
  .ae-date{font-size:11px;color:var(--text-muted);margin-bottom:3px;font-weight:500;}
  .acomp-add-btn{padding:7px 14px;background:transparent;border:1px solid var(--border);border-radius:8px;font-family:"DM Sans",sans-serif;font-size:12px;font-weight:500;color:var(--accent-light);cursor:pointer;transition:all 0.2s;margin-top:8px;}
  .acomp-add-btn:hover{border-color:var(--accent-light);color:var(--accent-light);}
  .card-actions{display:flex;gap:10px;margin-top:16px;padding-top:16px;border-top:1px solid var(--border);flex-wrap:wrap;}
  .btn-save{padding:10px 20px;background:linear-gradient(135deg,var(--accent),var(--accent-light));color:#015058;border:none;border-radius:8px;font-family:"DM Sans",sans-serif;font-size:13px;font-weight:600;cursor:pointer;transition:all 0.2s;}
  .btn-save:hover{background:var(--accent-light);}
  .btn-save:disabled{opacity:0.5;cursor:not-allowed;}
  .btn-delete{padding:10px 14px;background:var(--red-bg);border:1px solid rgba(255,112,112,0.25);border-radius:8px;font-size:13px;color:var(--red);cursor:pointer;margin-left:auto;font-family:"DM Sans",sans-serif;font-weight:500;transition:all 0.2s;}
  .btn-delete:hover{background:rgba(255,112,112,0.2);}
  .progress-bar-wrap{background:var(--surface);border:1px solid var(--border);border-radius:var(--radius);padding:18px 22px;margin-bottom:24px;box-shadow:var(--shadow);display:flex;align-items:center;gap:16px;}
  .progress-info{flex:1;}
  .progress-info h3{font-size:14px;font-weight:600;margin-bottom:8px;}
  .bar-track{background:var(--surface2);border-radius:4px;height:8px;overflow:hidden;}
  .bar-fill{height:100%;background:linear-gradient(90deg,var(--accent),var(--accent-light));border-radius:4px;transition:width 0.5s ease;}
  .progress-pct{font-family:"Playfair Display",serif;font-size:24px;font-weight:700;color:var(--accent-light);}
  .loading-overlay{position:fixed;inset:0;background:rgba(1,80,88,0.92);display:flex;flex-direction:column;align-items:center;justify-content:center;z-index:500;gap:16px;}
  .loading-overlay.hidden{display:none;}
  .spinner{width:36px;height:36px;border:3px solid var(--border);border-top-color:var(--accent);border-radius:50%;animation:spin 0.8s linear infinite;}
  @keyframes spin{to{transform:rotate(360deg)}}
  .loading-overlay p{font-size:14px;color:var(--text-muted);}
  .error-screen{min-height:70vh;display:flex;align-items:center;justify-content:center;flex-direction:column;text-align:center;gap:12px;padding:40px;}
  .error-screen .es-icon{font-size:48px;margin-bottom:8px;}
  .error-screen h2{font-family:"Playfair Display",serif;font-size:24px;}
  .error-screen p{color:var(--text-muted);font-size:15px;line-height:1.7;max-width:400px;}
  .toast{position:fixed;bottom:28px;right:28px;background:var(--surface);color:var(--text);border:1px solid var(--border);border-radius:10px;padding:12px 20px;font-size:13px;display:flex;align-items:center;gap:8px;transform:translateY(60px);opacity:0;transition:all 0.3s cubic-bezier(0.34,1.56,0.64,1);z-index:999;box-shadow:0 6px 24px rgba(0,60,65,0.5);}
  .toast.show{transform:translateY(0);opacity:1;}
  @media(max-width:640px){.fields-grid{grid-template-columns:1fr;}.field-full{grid-column:1;}.perfil-card{flex-wrap:wrap;}.perfil-meta{margin-left:0;text-align:left;}header{padding:0 16px;}.container{padding:24px 16px 60px;}.header-inner{padding:16px 0;}.codigo-pill{display:none;}}
</style>
</head>
<body>

<div class="loading-overlay" id="loadingOverlay">
  <div class="spinner"></div>
  <p id="loadingMsg">Carregando seu PDI...</p>
</div>

<header>
  <div class="header-inner">
    <div class="logo-badge">P</div>
    <div class="header-text">
      <h1>Plano de Desenvolvimento Individual</h1>
      <span>PDI Mentoria</span>
    </div>
    <div class="header-right">
      <div class="sync-indicator">
        <div class="sync-dot" id="syncDot"></div>
        <span id="syncLabel">Conectando...</span>
      </div>
      <div class="codigo-pill" id="codigoPill">&#8212;</div>
    </div>
  </div>
</header>

<div class="container" id="mainContainer"></div>

<div class="toast" id="toast">
  <span id="toastIcon">&#10003;</span>
  <span id="toastMsg">Salvo!</span>
</div>

<script>
var GIST_ID    = '4f26b75fa486624b670a1f6ea5c323be';
var GIST_TOKEN = ['ghp_jSq2mclCnytKETCH34','HT0z37odH1A1314XhE'].join('');
var GIST_FILE  = 'pdi_mentoria.json';

(function(){
  try{
    var ico=document.getElementById('app-icon').getAttribute('href');
    var m={name:'Meu PDI - Desenvolvimento Individual',short_name:'Meu PDI',start_url:window.location.href,display:'standalone',background_color:'#f9f7f4',theme_color:'#2d7a5a',icons:[{src:ico,sizes:'512x512',type:'image/png'}]};
    var b=new Blob([JSON.stringify(m)],{type:'application/json'});
    document.getElementById('pwa-manifest').href=URL.createObjectURL(b);
  }catch(e){}
})();

var codigo=new URLSearchParams(window.location.search).get('codigo');
var db={mentorandos:[],pdis:{}};
var itens=[];

async function gistGet(){
  var r=await fetch('https://api.github.com/gists/'+GIST_ID,{headers:{'Authorization':'token '+GIST_TOKEN,'Accept':'application/vnd.github.v3+json'}});
  if(!r.ok)throw new Error('Falha ao ler Gist: '+r.status);
  var d=await r.json();
  return JSON.parse((d.files[GIST_FILE]&&d.files[GIST_FILE].content)||'{"mentorandos":[],"pdis":{}}');
}
async function gistSet(p){
  var body={files:{}};body.files[GIST_FILE]={content:JSON.stringify(p,null,2)};
  var r=await fetch('https://api.github.com/gists/'+GIST_ID,{method:'PATCH',headers:{'Authorization':'token '+GIST_TOKEN,'Accept':'application/vnd.github.v3+json','Content-Type':'application/json'},body:JSON.stringify(body)});
  if(!r.ok)throw new Error('Falha ao salvar: '+r.status);
}

function setSyncStatus(s){var dot=document.getElementById('syncDot'),lbl=document.getElementById('syncLabel');dot.className='sync-dot';if(s==='ok'){dot.classList.add('ok');lbl.textContent='Sincronizado';}if(s==='busy'){dot.classList.add('busy');lbl.textContent='Salvando...';}if(s==='err'){dot.classList.add('err');lbl.textContent='Erro de sync';}}

async function persistir(){
  setSyncStatus('busy');
  try{db=await gistGet();if(!db.pdis)db.pdis={};db.pdis[codigo]=itens;await gistSet(db);setSyncStatus('ok');}
  catch(e){setSyncStatus('err');showToast('Erro ao sincronizar: '+e.message,'err');throw e;}
}

async function init(){
  var container=document.getElementById('mainContainer');
  if(!codigo){
    document.getElementById('loadingOverlay').classList.add('hidden');
    container.innerHTML='<div class="error-screen"><div class="es-icon">&#128273;</div><h2>Link invalido</h2><p>Este link nao contem um codigo de mentorando.<br>Solicite ao seu mentor o link correto.</p></div>';
    return;
  }
  document.getElementById('codigoPill').textContent=codigo;
  try{db=await gistGet();itens=(db.pdis&&db.pdis[codigo])?db.pdis[codigo]:[];setSyncStatus('ok');}
  catch(e){setSyncStatus('err');showToast('Erro ao carregar dados.','err');}
  finally{document.getElementById('loadingOverlay').classList.add('hidden');}
  var mentorando=(db.mentorandos||[]).find(function(m){return m.codigo===codigo;});
  var nomeExibido=mentorando?mentorando.nome:codigo;
  var iniciais=nomeExibido.split(' ').map(function(p){return p[0]||'';}).join('').slice(0,2).toUpperCase();
  container.innerHTML=
    '<div class="perfil-card">'
    +'<div class="avatar">'+iniciais+'</div>'
    +'<div class="perfil-info"><h2>'+nomeExibido+'</h2><p>'+(mentorando&&mentorando.email?mentorando.email:'')+'</p></div>'
    +'<div class="perfil-meta"><strong>'+codigo+'</strong>Codigo do mentorando</div>'
    +'</div>'
    +'<div id="progressWrap"></div>'
    +'<div class="section-title">&#10022; Meu PDI</div>'
    +'<p class="section-sub">Registre seus compromissos de desenvolvimento. Clique em cada item para ver e editar os detalhes.<br>Atualize o acompanhamento sempre que avancar.</p>'
    +'<button class="btn-add" id="btnAdicionar" onclick="adicionarItem()"><span style="font-size:18px">+</span> Adicionar acao de desenvolvimento</button>'
    +'<div id="pdiList"></div>';
  renderLista();
}

function renderProgress(){
  var total=itens.length,conc=itens.filter(function(i){return i.status==='concluido';}).length;
  var pct=total===0?0:Math.round(conc/total*100);
  var wrap=document.getElementById('progressWrap');
  if(!wrap||total===0){if(wrap)wrap.innerHTML='';return;}
  wrap.innerHTML='<div class="progress-bar-wrap"><div class="progress-info"><h3>'+conc+' de '+total+' acoes concluidas</h3><div class="bar-track"><div class="bar-fill" style="width:'+pct+'%"></div></div></div><div class="progress-pct">'+pct+'%</div></div>';
}

function renderLista(){
  renderProgress();
  var el=document.getElementById('pdiList');
  if(!el)return;
  if(itens.length===0){el.innerHTML='<div style="text-align:center;padding:40px 20px;color:var(--text-muted);font-size:14px;">Nenhuma acao ainda. Clique em "Adicionar" para comecar seu PDI.</div>';return;}
  el.innerHTML=itens.map(function(item,idx){
    var sc=item.status==='concluido'?'concluido':item.status==='andamento'?'em-andamento':'';
    var bs=item.status==='concluido'?'<span class="badge badge-status-c">&#10003; Concluido</span>':item.status==='andamento'?'<span class="badge badge-status-a">&#8987; Em andamento</span>':'<span class="badge badge-status-p">Pendente</span>';
    var bq=item.quando?'<span class="badge badge-quando">&#128197; '+item.quando+'</span>':'';
    var bv=item.quanto?'<span class="badge badge-valor">&#128176; '+item.quanto+'</span>':'';
    var hist=(item.acompanhamentos||[]).map(function(a){return '<div class="acomp-entry"><div class="ae-date">'+a.data+'</div><div>'+esc(a.texto)+'</div></div>';}).join('');
    return '<div class="pdi-card '+sc+'" id="card_'+idx+'">'
      +'<div class="pdi-card-header" onclick="toggleCard('+idx+')">'
      +'<div class="pdi-num">'+(item.status==='concluido'?'&#10003;':idx+1)+'</div>'
      +'<div class="pdi-titulo-wrap"><div class="pdi-oque'+(item.oque?'':' vazio')+'">'+(item.oque||'Nova acao de desenvolvimento...')+'</div>'
      +'<div class="pdi-badges">'+bs+bq+bv+'</div></div>'
      +'<div class="pdi-chevron">&#8964;</div></div>'
      +'<div class="pdi-body">'
      +'<div class="fields-grid">'
      +'<div class="field-group field-full"><label>&#127919; O Que — Qual e a acao ou competencia a desenvolver?</label><textarea id="oque_'+idx+'" placeholder="Descreva o que voce vai desenvolver...">'+(item.oque||'')+'</textarea></div>'
      +'<div class="field-group field-full"><label>&#128296; Como — De que forma voce vai alcancar isso?</label><textarea id="como_'+idx+'" placeholder="Cursos, leituras, praticas, mentorias...">'+(item.como||'')+'</textarea></div>'
      +'<div class="field-group"><label>&#128197; Quando — Prazo ou periodo</label><input type="text" id="quando_'+idx+'" placeholder="Ex: Ate marco de 2026" value="'+(item.quando||'')+'"></div>'
      +'<div class="field-group"><label>&#128176; Quanto — Investimento (se houver)</label><input type="text" id="quanto_'+idx+'" placeholder="Ex: R$ 500 / mes" value="'+(item.quanto||'')+'"></div>'
      +'<div class="field-group field-full"><label>&#128202; Status</label><select id="status_'+idx+'">'
      +'<option value="pendente"'+((!item.status||item.status==='pendente')?' selected':'')+'>\u2b1c Pendente</option>'
      +'<option value="andamento"'+(item.status==='andamento'?' selected':'')+'>&#8987; Em andamento</option>'
      +'<option value="concluido"'+(item.status==='concluido'?' selected':'')+'>\u2705 Concluido</option>'
      +'</select></div>'
      +'<div class="field-group field-full"><label>&#128221; Acompanhamento — Novo registro</label>'
      +'<textarea class="acomp-area" id="novoAcomp_'+idx+'" placeholder="Registre um progresso, aprendizado ou atualizacao..."></textarea>'
      +'<button class="acomp-add-btn" onclick="adicionarAcomp('+idx+')">+ Registrar acompanhamento</button>'
      +(hist?'<div class="acomp-history">'+hist+'</div>':'')+'</div>'
      +'</div>'
      +'<div class="card-actions">'
      +'<button class="btn-save" id="btnSave_'+idx+'" onclick="salvarItem('+idx+')">&#128190; Salvar</button>'
      +'<button class="btn-delete" onclick="deletarItem('+idx+')">&#128465; Remover</button>'
      +'</div></div></div>';
  }).join('');
}

function toggleCard(idx){document.getElementById('card_'+idx).classList.toggle('open');}

async function adicionarItem(){
  var btn=document.getElementById('btnAdicionar');btn.disabled=true;
  itens.push({oque:'',como:'',quando:'',quanto:'',status:'pendente',acompanhamentos:[]});
  try{await persistir();renderLista();setTimeout(function(){var c=document.getElementById('card_'+(itens.length-1));if(c){c.classList.add('open');c.scrollIntoView({behavior:'smooth',block:'start'});}},50);}
  catch(_){itens.pop();renderLista();}
  finally{btn.disabled=false;}
}

async function salvarItem(idx){
  var btn=document.getElementById('btnSave_'+idx);if(btn)btn.disabled=true;
  itens[idx].oque=document.getElementById('oque_'+idx).value.trim();
  itens[idx].como=document.getElementById('como_'+idx).value.trim();
  itens[idx].quando=document.getElementById('quando_'+idx).value.trim();
  itens[idx].quanto=document.getElementById('quanto_'+idx).value.trim();
  itens[idx].status=document.getElementById('status_'+idx).value;
  try{await persistir();renderLista();setTimeout(function(){var c=document.getElementById('card_'+idx);if(c)c.classList.add('open');},30);showToast('Acao salva!','ok');}
  catch(_){}
  finally{if(btn)btn.disabled=false;}
}

async function adicionarAcomp(idx){
  var txt=document.getElementById('novoAcomp_'+idx).value.trim();
  if(!txt){showToast('Digite algo antes de registrar.','warn');return;}
  var agora=new Date().toLocaleString('pt-BR',{day:'2-digit',month:'2-digit',year:'numeric',hour:'2-digit',minute:'2-digit'});
  if(!itens[idx].acompanhamentos)itens[idx].acompanhamentos=[];
  itens[idx].acompanhamentos.unshift({data:agora,texto:txt});
  try{await persistir();renderLista();setTimeout(function(){var c=document.getElementById('card_'+idx);if(c)c.classList.add('open');},30);showToast('Acompanhamento registrado!','ok');}
  catch(_){}
}

async function deletarItem(idx){
  if(!confirm('Remover esta acao do seu PDI?'))return;
  itens.splice(idx,1);
  try{await persistir();}catch(_){}
  renderLista();showToast('Acao removida.','ok');
}

function esc(s){return s.replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').split('\n').join('<br>');}

var toastTimer;
function showToast(msg,tipo){var icons={ok:'\u2713',err:'\u2715',warn:'\u26a0'};var t=document.getElementById('toast');document.getElementById('toastMsg').textContent=msg;document.getElementById('toastIcon').textContent=icons[tipo]||'\u2713';t.classList.add('show');clearTimeout(toastTimer);toastTimer=setTimeout(function(){t.classList.remove('show');},3000);}

init();
</script>
</body>
</html>
